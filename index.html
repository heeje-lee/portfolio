<style>
/* Layout: fixed mono menu tree along the top, staggered two-up image rows on the right,
   full-bleed splash that slides up on first scroll (after songforthemute.com). */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --bar: #000000;
  --bar-ink: #f4f0eb;
  --splash: #ffffff;
  --on-image: #ffffff;
  /* Futura Medium. Macs/iPhones have Futura built in; everywhere else falls back to Jost,
     a free Futura look-alike from Google Fonts. */
  --mono: Futura, "Futura PT", "Jost", "Century Gothic", sans-serif;
  --sans: var(--mono);
  --unit: 6px;
  --bar-h: 0px;
  --menu-h: 40px;
  --content-x: 24px;
  --intro-speed: 1.2s;
  --intro-easing: cubic-bezier(0.46, 0.03, 0.52, 0.96);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); color: var(--ink); }
body { font: 500 13px/1.6 var(--mono); -webkit-font-smoothing: antialiased; }
html.locked, html.locked body { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px dashed currentColor; outline-offset: 3px; }

/* ---------- menu: the original tree, turned to run along the top ----------
   Spine runs across the top; each project name is a link. The current page is underlined. */
.menu {
  position: fixed; left: 0; right: 0; z-index: 5;
  /* solid white bar so page text never shows through behind the menu */
  top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: 10px;
  background: var(--paper);
  display: flex; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--ink);
  transition: background .6s ease-in-out, color .6s ease-in-out;
}
/* white menu text only when the opening screen has a picture on it */
body.splash-visible.splash-img .menu { color: var(--on-image); background: transparent; }
.branches { position: relative; padding-left: calc(var(--unit) * 2); pointer-events: auto; }
.branches::before {
  content: ""; position: absolute; left: 0; top: .75rem;
  width: 1px; height: calc(100% - 1.5rem); background: currentColor;
}
.root {
  display: flex; flex-wrap: wrap; justify-content: center; column-gap: calc(var(--unit) * 4);
  padding: calc(var(--unit) * 1.5) 0 0;
}
.root::before { top: 0; left: .75rem; width: calc(100% - 1.5rem); height: 1px; }
.branch { position: relative; }
.link {
  display: flex; align-items: center; flex-wrap: nowrap;
  padding: var(--unit) 0; line-height: 18px;
  text-transform: uppercase; cursor: pointer;
}
.link .label { letter-spacing: .04em; flex-grow: 0; padding-right: calc(var(--unit) * 2); white-space: pre; transition: opacity .3s; }
.root > .branch > .link { justify-content: center; }
.root > .branch > .link .label { padding-right: 0; }
.root > .branch > .link:hover .label { opacity: .5; }
.root > .branch > .link.current .label { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }

/* ---------- splash ---------- */
.splash {
  position: fixed; inset: 0; z-index: 4; height: 100%;
  background: var(--splash); color: var(--on-image); cursor: pointer;
  transform: translateY(0%);
  transition: transform var(--intro-speed) var(--intro-easing);
  overflow: hidden;
}
.splash.out { transform: translateY(-100%); }
.splash .ph { position: absolute; inset: 0; background: var(--splash); }
.splash .ph img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 5s; }
.splash .ph img.loaded { opacity: 1; }
@keyframes showup { from { opacity: 0; } to { opacity: 1; } }

/* braille "YIHEEJAY" on the opening screen; dots pop in at random within 5s on each load.
   Proportions follow standard braille: dot 1.5, dot spacing 2.5, cell pitch 6 (in --u). */
.braille {
  --u: clamp(5px, 1.1vw, 12px);
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; z-index: 1;
  color: var(--ink); pointer-events: none;
}
body.splash-img .braille { color: var(--on-image); }
/* once every dot is in, the word can be hovered */
.braille.ready { pointer-events: auto; }
/* each cell is padded so the hover targets touch (no dead gaps between letters) */
.braille .cell { position: relative; padding: calc(var(--u) * 2) calc(var(--u) * 1.75); }
.braille .dots {
  display: grid; grid-template-columns: repeat(2, calc(var(--u) * 1.5));
  grid-template-rows: repeat(3, calc(var(--u) * 1.5));
  grid-auto-flow: column; gap: calc(var(--u) * 1);
}
.braille .dot {
  width: 100%; height: 100%; border-radius: 50%; background: currentColor;
  opacity: 0; transform: scale(.3);
  transition: opacity .45s ease, transform .45s cubic-bezier(.3, 1.6, .5, 1);
}
.braille .dot.empty { visibility: hidden; }
.braille .dot.on { opacity: 1; transform: scale(1); }
/* English letter, same Futura as the menu, cap height about the height of a braille cell */
.braille .letter {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 500 calc(var(--u) * 9)/1 var(--mono); text-transform: uppercase;
  opacity: 0; transform: translateY(calc(var(--u) * .8));
  transition: opacity .3s ease, transform .3s ease;
  pointer-events: none;
}
.braille .cell .dot.on { transition: opacity .3s ease, transform .3s ease; }
.braille .cell.en .dot.on { opacity: 0; transform: scale(.4); }
.braille .cell.en .letter { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .braille .dot, .braille .letter, .braille .cell .dot.on { transition: none; }
}

/* ---------- content ---------- */
main {
  padding-top: calc(var(--bar-h) + 14px + var(--menu-h) + 32px + env(safe-area-inset-top, 0px));
  padding-left: max(var(--content-x), env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 0;
  max-width: 1600px;
  transition: opacity .35s ease-in-out;
}
body.bar-closed main { padding-top: calc(14px + var(--menu-h) + 32px + env(safe-area-inset-top, 0px)); }
main.fade { opacity: 0; }
.rows { display: grid; gap: calc(var(--unit) * 8); }
.row { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
.row.one { grid-template-columns: 1fr; }
.item {
  display: block; width: var(--w, 90%); max-width: 100%;
  justify-self: start; transform: translateY(var(--o, 0%));
}
.item.right { justify-self: end; }
.reveal { transition: transform 1.33s ease, opacity 1s ease; }
.item.pre .reveal { opacity: 0; transform: translateY(60px); }
.ph { position: relative; background: var(--c, #999); overflow: hidden; max-width: 100%; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.cap {
  position: absolute; top: 10px; left: 12px; right: 12px; z-index: 1;
  color: var(--on-image); text-transform: uppercase; line-height: 1.4;
}
a.item .ph::after {
  content: ""; position: absolute; inset: 0; background: var(--ink); opacity: 0;
  transition: opacity .4s ease;
}
a.item:hover .ph::after { opacity: .08; }

/* project + about pages */
.intro {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
  gap: calc(var(--unit) * 6); padding-block: 15vh 10vh; align-items: end;
}
.title {
  font-family: var(--sans); font-weight: 500; text-transform: uppercase;
  font-size: clamp(28px, 3.6vw, 60px); line-height: 1; letter-spacing: .01em;
  margin: 0 0 calc(var(--unit) * 4); text-wrap: balance;
}
.meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 18px; text-transform: uppercase; margin: 0; }
.meta dt { opacity: .5; }
.meta dd { margin: 0; }
.body { max-width: 56ch; margin: 0; font-size: 13px; line-height: 1.7; }
.body p { margin: 0 0 1em; }
.sec-label {
  display: flex; align-items: center; gap: 12px; text-transform: uppercase;
  padding-block: 12vh 18px;
}
.sec-label::after { content: ""; flex: 0 0 9rem; height: 1px; background: currentColor; }
/* text column centered on the page; images below it stay full width */
.sec-col { max-width: 62ch; margin: 0 auto; }
.sec-col .sec-label { padding-block: 12vh 18px; }
.sec-body { max-width: 62ch; margin: 0 0 calc(var(--unit) * 6); font-size: 13px; line-height: 1.7; }
.sec-body p { margin: 0 0 1em; }
.sec-sub { text-transform: uppercase; letter-spacing: .04em; font-size: 12px; opacity: .55; margin: 2.4em 0 .8em; }
.sec-list { margin: 0 0 1.2em; padding-left: 1.2em; }
.sec-list li { margin-bottom: .35em; }
.sec-text { max-width: 56ch; margin: 0 0 calc(var(--unit) * 6); font-size: 13px; line-height: 1.7; }
.next {
  display: flex; align-items: center; gap: 12px; text-transform: uppercase;
  padding-block: 16vh 0;
}
.next .line { flex: 0 0 4rem; height: 1px; background: currentColor; transition: flex-basis .4s ease; }
.next:hover .line { flex-basis: 8rem; }
.contact-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; text-transform: uppercase; }
.contact-list .sel { user-select: all; text-transform: none; }
.copy { text-decoration: underline; text-underline-offset: 2px; margin-left: 8px; text-transform: uppercase; }

/* ---------- moodboard project layout (scattered, drifting images) ---------- */
main { overflow-x: clip; }
.mb {
  width: 75%; margin: 0 auto; padding-top: calc(var(--unit) * 8);
  display: flex; flex-wrap: wrap; justify-content: space-evenly; align-items: center;
  --k: 1;
}
.mb-item { position: relative; z-index: 1; width: 25%; margin-bottom: calc(var(--unit) * 8); touch-action: pan-y; }
.mb-item:nth-child(2n) { margin-left: auto; margin-right: 0; }
.mb-item.small { width: 16.666%; }
.mb-item.large { width: 41.666%; }
/* images stay put in the flow (no drifting or dragging); they just fade in */
.mb-story { opacity: 0; transition: opacity 1s; }
.mb-item.in .mb-story { opacity: 1; }
.mb-media { position: relative; overflow: hidden; background: var(--c, #999); }
.mb-media img, .mb-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; }
.mb-cap { margin-top: 6px; font-size: 10px; line-height: 1.4; }
.mb-note { max-width: 62ch; margin: calc(var(--unit) * 12) auto calc(var(--unit) * 14); font-size: 13px; line-height: 1.7; }
.mb-note p { margin: 0 0 1em; }
strong { font-weight: 700; }
.mb-note .fine { font-size: 11px; opacity: .6; font-style: italic; margin-bottom: calc(var(--unit) * 5); }
.mb-note .sec-label { padding-block: calc(var(--unit) * 7) 14px; }
/* images placed between paragraphs: break out of the narrow text column to the moodboard width */
.mb.mb-inline {
  width: 75vw; margin: calc(var(--unit) * 4) 0 calc(var(--unit) * 4) calc(50% - 37.5vw); padding-top: 0;
  justify-content: center; align-items: flex-start; gap: calc(var(--unit) * 6);
}
.mb.mb-inline > .mb-item { margin: 0; }
.rv { transition: transform 1.33s ease, opacity 1s ease; }
.rv.pre { opacity: 0; transform: translateY(40px); }
.intro.slim .body:empty { display: none; }

/* project video (Fast-Fashion, UAV) */
.video { position: relative; width: 100%; background: #f1f1ef; overflow: hidden; }
.video video, .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
.video .vsoon { position: absolute; inset: 0; display: grid; place-items: center; text-transform: uppercase; letter-spacing: .06em; opacity: .45; }
.video-cap { margin-top: 8px; font-size: 11px; }

footer.foot {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 36px;
  padding-block: 18vh 48px; align-items: end;
}
footer.foot .slash { font-family: var(--sans); font-weight: 500; font-size: 40px; line-height: 1; }
footer.foot p { margin: 0 0 12px; max-width: 56ch; }
footer.foot nav { display: flex; gap: 18px; text-transform: uppercase; flex-wrap: wrap; }
footer.foot nav a:hover { text-decoration: underline; text-underline-offset: 2px; }

/* ---------- narrow screens ---------- */
@media (max-width: 860px) {
  .mb { width: 100%; --k: .35; }
  .mb-item, .mb-item.large { width: 80%; }
  .mb-item.small { width: 56%; }
  .mb-note { margin-block: 32px 56px; }
  .mb.mb-inline { width: calc(100vw - 2 * var(--content-x)); margin-left: calc(50% - 50vw + var(--content-x)); }
  :root { --content-x: 16px; }
  .row, .row.one { grid-template-columns: 1fr; gap: 24px; }
  .rows { gap: 24px; }
  .item, .item.right { width: 100%; transform: none; justify-self: stretch; }
  .intro, footer.foot { grid-template-columns: 1fr; padding-block: 48px 32px; gap: 24px; }
  .sec-label { padding-block: 56px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  :root { --intro-speed: .01s; }
  .reveal, .mb-story, .rv { transition: none !important; animation: none !important; }
  .item.pre .reveal { opacity: 1; transform: none; }
  .mb-story { opacity: 1; }
  .rv.pre { opacity: 1; transform: none; }
}
</style>
</head>

<main id="main"></main>

<script>
/* =========================================================
   EDIT YOUR CONTENT HERE
   Every image is { c: placeholder color, r: aspect ratio, src: optional image path }.
   Put real photos in an /images folder next to index.html and set src: "images/xyz.jpg".
   ========================================================= */
const SITE = {
  first: "HEEJE",
  last: "LEE",
  /* Opening screen. Blank white for now. To show a picture later, set
     src: "images/your-photo.jpg" (it fills the screen and fades in; menu text turns white over it). */
  splash: { c: "#ffffff", src: "" },
  email: "heeje.lee@berkeley.edu",
  links: [
    { label: "Instagram", href: "https://instagram.com/YIHEEJAY" },
    { label: "LinkedIn", href: "https://www.linkedin.com/in/heeje-lee" }
  ],
  blurb: "Heeje Lee. Designer and prototyper working between electrical engineering and interaction design. Objects that listen, react and remember."
};

/* Projects appear in this order in the menu and on the home page.
   sections: a list of headed parts, each { label: "Heading", text: [...], imgs: [...] }.
     In text, a string is a paragraph, { h: "Small heading" } is a subheading,
     and { list: ["...", "..."] } is a bulleted list. **bold** and _italic_ work everywhere.
   video: put an .mp4 in a /videos folder and set src: "videos/name.mp4",
          or paste a YouTube / Vimeo link as src. r is the video's shape (16/9 for most videos). */
const PROJECTS = [
  {
    slug: "fast-fashion", title: "Fast-Fashion", year: "2023",
    type: "Art + Tech Exhibition @ Gray Area San Francisco", tools: "TouchDesigner, P5.js, MadMapper",
    summary: "Art+Tech exhibition highlighting how important brand storytelling is in the midst of fast-fashion trends",
    video: { src: "https://youtu.be/VzrD8MKERgs", poster: "", r: "16/9", cap: "" },
    sections: [
      { label: "Overview", text: [
        "“Fast Fashion” is a spatial art-and-technology exhibition visualizing the impact of brand storytelling. The work explores how powerful narratives can elevate even the simplest designs into objects of desire, which can drive trends and push other brands toward rapid and often unethical mass production."
      ] },
      { label: "Context", text: [
        "By visualizing these processes into an immersive environment, I examined how storytelling rather than design defines authenticity, desire, and cultural meaning. How brand storytelling can shape perception, value, and community.",
        "One side of the installation showcased behind-the-scenes footage and production imagery, highlighting the raw labor and process that contrast with fashion’s polished, luxurious front-end. On the opposite side, I projection-mapped runway footage to display the spectacle of high fashion. Beyond imagery, I incorporated bold statements about storytelling and authenticity to challenge viewers to question what gives a brand meaning. By essentially visualizing the whole spectrum of fashion, these layered visual and conceptual elements worked together to create an immersive experience that invited reflection on the relationship between fashion, narrative, and perception."
      ], imgs: [{ src: "images/fast_fashion2.JPG", r: "1800/1200" }, { src: "images/fast_fashion4.JPG", r: "1200/1800", cap: "'Signing into' the Fashion Show" }] },
      { label: "Technical Development", text: [
        "Technology functioned as a spatial storytelling medium rather than a focal point. Projection mapping, software coded and node-based generative visuals, and point cloud rendering were used to design the digital surfaces of the physical installation.",
        "By designing the space itself as an interface, the installation positioned the environment as the first point of engagement, allowing the technical systems to remain subtle."
      ], imgs: [{ src: "images/fast_fashion1.JPG", r: "4/3" }, { src: "images/fast_fashion5.JPG", r: "1800/1200" }] }
    ],
    cover: { src: "images/fast_fashion_cover.png", r: "1200/1800" }
  },
  {
    slug: "uav-systems-design-integration", title: "RQ-4 Global Hawk", year: "2024-2026",
    type: "Industry Systems Design & Integration Experience @ Northrop Grumman", tools: "Systems Design, Hands-on Systems Integration, JIRA, ",
    summary: "Worked on the upgrade and redesign of the Northrop Grumman RQ-4 Global Hawk Systems. The RQ-4 Global Hawk a high-altitude, long-endurance (HALE) unmanned aerial vehicle (UAV) used primarily for intelligence, surveillance, and reconnaissance (ISR)",
    video: { src: "", poster: "", r: "16/9", cap: "" },
    sections: [
      { label: "Project Summary & Role", text: [
        "As a Systems Integrator, I work on the sustainment and upgrade efforts for a legacy UAV platform. The legacy unmanned aerial vehicle (UAV) consists of interconnected subsystems and LRUs working with each other in numerous different ways. My role involves tracking system life cycles, integrating fixes, designing new software logic, and hardware updates across subsystems. Most importantly, I am in charge of integrating new engineering builds, and also discovering additional testing points that can improve the system more than the original intent. I believe through this role, I practiced how to really think in a systems-design and user-centered method. I collaborate closely with project managers, subsystem responsible engineers, and lab operations personnel to ensure every upgrade is properly implemented, tested, and performs as expected when returned to the field."
      ] },
      { label: "Engineering Design Philosophy and Thinking", text: [
        "As a Systems Design and Integration Engineer, my job was to know the system of the GlobalHawk like the back of my hand.",
        { h: "Systems Design and Re-Design" },
        "Each problem I encounter typically begins with a single PAR (Problem Anomaly Report) from a stakeholder or pilot. These could include PARs such as inaccurate location reporting, unexpected latency, or even inconsistent sensor behavior. Approaching with a systems level mindset, I begin by reviewing the requirements and the legacy design of the system and subsystems. From here, I consult the Responsible Engineers to gather expert insight into how the subsystem was originally intended to function.",
        "After understanding the systems logic design, if it requires a redesign of system logic, I consult the software team as it gives me a thorough understanding of identifying gaps that could be the cause of the issue. With this technical background in place, I construct an improved system design logic with a pilot-centered focus. It becomes my guiding design principle.",
        "I ask questions to guide my system logic:",
        { list: [
          "How can I make this clearer and less confusing for the pilot?",
          "What logic changes would make the data more accurate, reliable, and efficiently reported on the pilot’s work station?"
        ] },
        "In the lab, integration IS iterative prototyping. We test from bottom-up which includes low-level functionality all the way up to full high level system behavior that reflects operational scenarios reflecting real missions. Edge cases are especially important in every integration period. In a creative design context, edge cases are polished but here, they determine whether a pilot receives critical information and can react in a timely manner.",
        "Many improvements come from identifying these unexpected conditions and redesigning how the data should behave. As edge cases emerge, I evaluate each one from the pilot’s perspective, ensuring the system behaves predictably in all possible scenarios. During this process, I also uncover gaps not only within the primary subsystem but also across communication channels with other subsystems and LRUs. This broad systems-level view frequently leads to additional discussions with other REs and new findings in parallel subsystems that also require attention. Once all integration and testing points are satisfied, the final design build is created by the software team, and goes through formal integration and test procedures, allowing the new engineering build to be sent out to the field and implemented.",
        { h: "Designing Within Constraints: Human Operations + Complex Systems" },

      ], imgs: [{ c: "#8a96a3", r: "4/3" }, { c: "#2f3640", r: "4/5" }, { c: "#c3c9cf", r: "1/1" }, { c: "#5d6b78", r: "3/4" }] },
      { label: "Reflection", text: [

    slug: "geographical-communications-network-systems-design", title: "Geographical Communications Network", year: "2022-2024",
    type: "Industry Systems Design, Test and Verification Experience @ Northrop Grumman", tools: "QGIS, Python, MATLAB, Cameo",

/* braille: YIHEEJAY. Dots numbered 1-2-3 down the left column, 4-5-6 down the right. */
const BRAILLE_WORD = "YIHEEJAY";
const BRAILLE_DOTS = { Y: [1, 3, 4, 5, 6], I: [2, 4], H: [1, 2, 5], E: [1, 5], J: [2, 4, 5], A: [1] };
const BRAILLE_TIME = 5000;  /* every dot is in by 5 seconds */
const BRAILLE_HOLD = 5000;  /* a left-to-right swipe shows the English word this long */
(() => {
  const box = $("#braille");
  box.innerHTML = [...BRAILLE_WORD].map((ch) => `<div class="cell"><div class="dots">${[1, 2, 3, 4, 5, 6]
    .map((n) => `<span class="dot${BRAILLE_DOTS[ch].includes(n) ? "" : " empty"}"></span>`).join("")}</div><span class="letter" aria-hidden="true">${ch}</span></div>`).join("");
  const cells = [...box.querySelectorAll(".cell")];
  const dots = [...box.querySelectorAll(".dot:not(.empty)")];

  /* 1. dots pop in at random; the word becomes hoverable when the last one lands */
  let last = 0;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) dots.forEach((d) => d.classList.add("on"));
  else dots.forEach((d) => {
    const t = 150 + Math.random() * (BRAILLE_TIME - 600);   /* + .45s transition = in by 5s */
    last = Math.max(last, t);
    setTimeout(() => d.classList.add("on"), t);
  });
  setTimeout(() => box.classList.add("ready"), last + 450);

  /* 2. hover a letter: it turns English, then back to braille shortly after you leave */
  let whole = false, wholeTimer;
  const leaveTimers = new Map();
  cells.forEach((c) => {
    c.addEventListener("pointerenter", () => { clearTimeout(leaveTimers.get(c)); c.classList.add("en"); });
    c.addEventListener("pointerleave", () => {
      if (whole) return;
      leaveTimers.set(c, setTimeout(() => c.classList.remove("en"), 350));
    });
  });

  /* 3. one left-to-right sweep across the word: all of it turns English for 5s */
  let sweep = null;   /* { x: furthest x so far, t: start time } */
  const rect = () => box.getBoundingClientRect();
  function flipAll() {
    whole = true;
    cells.forEach((c) => { clearTimeout(leaveTimers.get(c)); c.classList.add("en"); });
    clearTimeout(wholeTimer);
    wholeTimer = setTimeout(() => {
      whole = false;
      cells.forEach((c) => { if (!c.matches(":hover")) c.classList.remove("en"); });
    }, BRAILLE_HOLD);
  }
  box.addEventListener("pointerenter", (e) => {
    const r = rect();
    sweep = e.clientX - r.left < r.width * 0.15 ? { x: e.clientX, t: performance.now() } : null;
  });
  box.addEventListener("pointermove", (e) => {
    if (!sweep) return;
    const r = rect();
    if (e.clientX < sweep.x - 12 || performance.now() - sweep.t > 1600) { sweep = null; return; }   /* went back, or too slow */
    sweep.x = Math.max(sweep.x, e.clientX);
    if (e.clientX - r.left > r.width * 0.88) { sweep = null; flipAll(); }
  });
  box.addEventListener("pointerleave", (e) => {
    if (sweep && e.clientX >= rect().right - 4 && performance.now() - sweep.t <= 1600) flipAll();
    sweep = null;
  });
})();

let splashOn = false;
let splashBusy = false;   /* ignore input while the slide is running */
let hideTimer, homeTimer;
const isHome = () => ["", "#", "#home"].includes(location.hash);
function settle() { splashBusy = true; setTimeout(() => { splashBusy = false; }, 1300); }
function showSplash(animate) {
  if (splashOn) return;
  clearTimeout(hideTimer);
  splashOn = true;
  document.documentElement.classList.add("locked");
  document.body.classList.add("splash-visible");
  splash.hidden = false;
  if (animate) {
    splash.classList.add("seen");
    void splash.offsetHeight;   /* start from above the screen, then slide down */
    settle();
  }
  splash.classList.remove("out");
}
function hideSplash(force) {
  if (!splashOn || (splashBusy && force !== true)) return;
  splashOn = false;
  settle();
  splash.classList.add("out");
  document.body.classList.remove("splash-visible");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    document.documentElement.classList.remove("locked");
    splash.hidden = true;
  }, 1200);
}
/* from a project or About: slide the opening screen down, then swap to the home page behind it */
function returnHome() {
  if (splashOn || splashBusy) return;
  const fromPage = !isHome();
  showSplash(true);
  if (fromPage) homeTimer = setTimeout(() => {
    history.pushState(null, "", location.pathname + location.search);
    route();
  }, 1250);
}
/* only count an upward pull once you've been resting at the top, so momentum from
   scrolling up a page doesn't throw you back to the opening screen by accident */
let topSince = scrollY <= 0 ? performance.now() : 0, pull = 0, pulls = 0, pullT = 0;
addEventListener("scroll", () => {
  if (scrollY > 0) { topSince = 0; pull = pulls = 0; }
  else if (!topSince) topSince = performance.now();
}, { passive: true });
const restingAtTop = () => scrollY <= 0 && topSince && performance.now() - topSince > 350;
window.addEventListener("wheel", (e) => {
  if (splashOn) { if (e.deltaY > 0) hideSplash(); return; }
  if (e.deltaY >= 0 || !restingAtTop()) { pull = pulls = 0; return; }
  const now = performance.now();
  if (now - pullT > 400) pull = pulls = 0;
  pullT = now; pull -= e.deltaY; pulls++;
  if (pull > 60 || pulls >= 3) { pull = pulls = 0; returnHome(); }
}, { passive: true });
let touchY = null, touchTop = false;
window.addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; touchTop = scrollY <= 0; }, { passive: true });
window.addEventListener("touchmove", (e) => {
  if (touchY === null) return;
  const dy = touchY - e.touches[0].clientY;
  if (splashOn) { if (dy > 12) hideSplash(); }
  else if (touchTop && dy < -60) { touchY = null; returnHome(); }
}, { passive: true });
window.addEventListener("keydown", (e) => {
  if (splashOn && ["ArrowDown", "PageDown", " ", "Enter", "End"].includes(e.key)) { e.preventDefault(); hideSplash(); }
  else if (!splashOn && scrollY <= 0 && ["ArrowUp", "PageUp", "Home"].includes(e.key)) returnHome();
});

/* ---------- rendering ---------- */
function ph(img, cap) {
  const inner = img.src ? `<img src="${esc(img.src)}" alt="${esc(img.alt || "")}" loading="lazy">` : "";
  return `<div class="ph" style="--c:${img.c};aspect-ratio:${img.r}">${inner}${cap ? `<span class="cap">${esc(cap)}</span>` : ""}</div>`;
}
function item(img, { cap, href, w = 90, o = 0, right = false } = {}) {
  const tag = href ? "a" : "div";
  const h = href ? ` href="${href}"` : "";
  return `<${tag} class="item${right ? " right" : ""}"${h} style="--w:${w}%;--o:${o}%"><div class="reveal">${ph(img, cap)}</div></${tag}>`;
}
/* widths and offsets borrowed from the reference grid: slightly uneven, right column dropped */
const PAIRS = [[89, 0, 97, 4], [81, 6, 87, 0], [94, 0, 84, 9], [86, 3, 92, 0]];
function twoUp(imgs, caps = [], hrefs = []) {
  let out = "";
  for (let i = 0; i < imgs.length; i += 2) {
    const [lw, lo, rw, ro] = PAIRS[(i / 2) % PAIRS.length];
    out += `<div class="row">${item(imgs[i], { cap: caps[i], href: hrefs[i], w: lw, o: lo })}${imgs[i + 1] ? item(imgs[i + 1], { cap: caps[i + 1], href: hrefs[i + 1], w: rw, o: ro }) : ""}</div>`;
  }
  return out;
}
function footer() {

}

/* ---------- moodboard layout ---------- */
/* stable pseudo-random offsets per page, so the collage looks the same on every visit */
function seeded(str) {
  let h = 1779033703;
  for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 3432918353), h = (h << 13) | (h >>> 19);
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
function mbItem(img, rand) {
  const x = Math.round(rand() * 60 - 30), y = Math.round(rand() * 60 - 30);
  const media = !img.src ? "" : /\.(mp4|webm|mov)$/i.test(img.src)
    ? `<video src="${esc(img.src)}" autoplay muted loop playsinline></video>`
    : `<img src="${esc(img.src)}" alt="${esc(img.alt || img.cap || "")}" loading="lazy" draggable="false">`;
  return `<div class="mb-item ${esc(img.size || "medium")}" style="--x:${x}%;--y:${y}%;--x0:${x + 4}%;--y0:${y + 10}%">
    <div class="mb-story">
      <div class="mb-media" style="--c:${img.c};aspect-ratio:${img.r}">${media}</div>
      ${img.cap ? `<div class="mb-cap">${esc(img.cap)}</div>` : ""}
    </div></div>`;
}
/* a text list can mix paragraphs and images: a string is a paragraph,
   an image object (or an array of them) becomes an image group in place */
function blocks(list, rand) {
  return (list || []).map((b) => typeof b === "string"
    ? `<p class="rv">${fmt(b)}</p>`
    : `<div class="mb mb-inline">${[].concat(b).map((im) => mbItem(im, rand)).join("")}</div>`).join("");
}
function renderMoodboard(p, next) {
  const rand = seeded(p.slug);
  const meta = [["Project", p.code], ["Year", p.year], ["Type", p.type], ["Tools", p.tools]].filter(([, v]) => v);
  return `
    <section class="intro slim">
      <dl class="meta">${meta.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      <div><h1 class="title">${esc(p.title)}</h1><div class="body">${p.summary ? `<p>${fmt(p.summary)}</p>` : ""}</div></div>
    </section>
    <div class="mb">${(p.imagesBefore || []).map((im) => mbItem(im, rand)).join("")}</div>
    <section class="mb-note" id="sec-overview">
      ${p.note ? `<p class="fine rv">${fmt(p.note)}</p>` : ""}
      ${blocks(p.overview, rand)}
      <div class="sec-label rv" id="sec-process">Process</div>
      ${blocks(p.process, rand)}
    </section>
    <div class="mb">${(p.imagesAfter || []).map((im) => mbItem(im, rand)).join("")}</div>
    <a class="next" href="#${next.slug}">Next <span class="line"></span> ${esc(next.title)}</a>
    ${footer()}`;
}
function videoBlock(v) {
  const src = v.src || "";
  const yt = src.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  const vm = src.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  const allow = 'allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen';
  const inner = yt ? `<iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}?rel=0" title="Project video" ${allow}></iframe>`
    : vm ? `<iframe src="https://player.vimeo.com/video/${vm[1]}" title="Project video" ${allow}></iframe>`
    : src ? `<video src="${esc(src)}" controls playsinline preload="metadata"${v.poster ? ` poster="${esc(v.poster)}"` : ""}></video>`
    : `<span class="vsoon">Video coming soon</span>`;
  return `<div class="video" style="aspect-ratio:${v.r || "16/9"}">${inner}</div>${v.cap ? `<div class="video-cap">${esc(v.cap)}</div>` : ""}`;
}
const slugify = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function textBlock(b) {
  if (typeof b === "string") return `<p>${fmt(b)}</p>`;

  if (b.list) return `<ul class="sec-list">${b.list.map((t) => `<li>${fmt(t)}</li>`).join("")}</ul>`;

}
function renderProject(p) {

/* reveal tiles as they scroll into view (tiles already on screen stay visible) */
let io;
function armReveal() {
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) { document.querySelectorAll("#main .mb-item").forEach((el) => el.classList.add("in")); return; }
  io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.remove("pre"); io.unobserve(en.target); } });
  }, { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll("#main .item, #main .rv").forEach((el) => {
    if (el.getBoundingClientRect().top > innerHeight * 0.92) { el.classList.add("pre"); io.observe(el); }
  });
  /* moodboard images drift into place as they enter, including the ones already on screen */
  const mbIo = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); mbIo.unobserve(en.target); } });
  }, { rootMargin: "0px 0px -6% 0px" });
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll("#main .mb-item").forEach((el) => mbIo.observe(el))));
}

const main = $("#main");
function route() {

  if ((p || slug === "about") && splashOn) hideSplash(true);
  tree.querySelectorAll(".link").forEach((a) => a.classList.toggle("current", a.getAttribute("href") === "#" + slug));
  document.title = p ? `${p.title} — ${fullName}` : slug === "about" ? `About — ${fullName}` : `${fullName} Portfolio`;
  main.classList.add("fade");
  setTimeout(() => {
    main.innerHTML = html;
    window.scrollTo(0, 0);
    armReveal();
    const ce = $("#copyEmail");
    if (ce) ce.addEventListener("click", () => {
      navigator.clipboard?.writeText(SITE.email).then(() => { ce.textContent = "Copied"; })
        .catch(() => { const r = document.createRange(); r.selectNodeContents($("#email")); getSelection().removeAllRanges(); getSelection().addRange(r); });
    });
    main.classList.remove("fade");
    if (pendingSec) setTimeout(() => goSection(pendingSec), 60);
  }, main.innerHTML ? 300 : 0);
}
