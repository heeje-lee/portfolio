<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heeje Lee — Portfolio</title>
<meta name="description" content="Heeje Lee, creative technologist. A portfolio laid out like magazines on a living room coffee table.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Living room portfolio
   1. Opens on the living room.
   2. Scrolling zooms into the coffee table, then cross-fades to the
      top-down view of the table with the magazines (one per project).
   3. Hover a magazine and it slides out of the stack; click to open.
   ========================================================= */
:root {
  --ink: #f6eadb;
  --warm: #ffb46b;
  --sans: "Inter", system-ui, sans-serif;
  --serif: "DM Serif Display", Georgia, serif;
  --ease: cubic-bezier(.22,.8,.24,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #1a120c; color: var(--ink); font-family: var(--sans); }
body { height: 340vh; }              /* scroll distance that drives the zoom */
body.reading { height: auto; overflow: hidden; }
a { color: inherit; }

/* ---------- stage ---------- */
.stage { position: fixed; inset: 0; overflow: hidden; background: #1a120c; }
/* a 16:9 box that always covers the screen, so points in the photos stay put */
.scene {
  position: absolute; left: 50%; top: 50%;
  width: max(100vw, 177.78vh); height: max(56.25vw, 100vh);
  transform: translate(-50%, -50%);
}
.layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }
.layer img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
#top { opacity: 0; }
/* warm vignette over everything */
.stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(20,10,4,.55) 100%);
}

/* ---------- opening text ---------- */
.hero {
  position: absolute; left: clamp(20px, 4vw, 56px); bottom: clamp(24px, 6vh, 64px);
  z-index: 5; pointer-events: none; text-shadow: 0 2px 24px rgba(30,12,0,.55);
}
.hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 6vw, 92px); line-height: .95; margin: 0 0 10px; letter-spacing: -.01em; }
.hero p { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.hint {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5;
  font-size: 11px; letter-spacing: .3em; text-transform: uppercase; opacity: .8; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.hint::after { content: ""; width: 1px; height: 34px; background: currentColor; animation: drip 2.2s var(--ease) infinite; transform-origin: top; }
@keyframes drip { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

/* ---------- magazines ---------- */
/* the magazines sit on the tabletop; the table spans about 97% of the photo's height */
.table {
  position: absolute; left: 50%; top: 48.4%;
  width: 86%; aspect-ratio: 1; transform: translate(-50%, -50%);
  z-index: 3; pointer-events: none;
}
/* size the table area by the scene's height so it tracks the photo */
.scene .table { width: auto; height: 92%; }
.table.live { pointer-events: auto; }

.mag {
  position: absolute; left: var(--x); top: var(--y); width: 27%;
  aspect-ratio: 8.5 / 11; container-type: inline-size;
  transform: translate(var(--dx, 0), var(--dy, 0)) rotate(var(--r)) scale(var(--s, 1));
  opacity: var(--in, 0);
  transition: transform .45s var(--ease), box-shadow .45s var(--ease), filter .45s;
  box-shadow: 0 1px 1px rgba(0,0,0,.25), 6px 10px 18px rgba(40,18,4,.35);
  cursor: pointer; outline: none; display: block; text-decoration: none; border-radius: 1px;
}
/* the pages under the cover */
.mag::before {
  content: ""; position: absolute; inset: 0; z-index: -1; background: #f3ede2;
  transform: translate(1.2%, 1%); box-shadow: 1px 1px 0 #d9d0c1, 2px 2px 0 #eee6d8;
}
/* soft lamplight sheen from the upper left, matching the photo */
.mag::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(125deg, rgba(255,214,160,.22), transparent 40%, rgba(30,12,0,.18));
}
.table.live .mag:hover, .table.live .mag:focus-visible {
  --s: 1.05; z-index: 30 !important;
  transform: translate(calc(var(--dx, 0) + var(--px)), calc(var(--dy, 0) + var(--py))) rotate(calc(var(--r) * .55)) scale(var(--s));
  box-shadow: 0 2px 2px rgba(0,0,0,.2), 14px 24px 34px rgba(40,18,4,.45);
}
.table.live .mag:focus-visible { outline: 2px solid var(--warm); outline-offset: 4px; }
.table.live:has(.mag:hover) .mag:not(:hover) { filter: brightness(.82) saturate(.9); }

/* ---------- covers ---------- */
.cover { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
.mast { line-height: .82; margin: 0; padding: 5cqw 6cqw 0; white-space: nowrap; }
.issue { display: flex; justify-content: space-between; font: 400 3.4cqw/1 "Space Mono", monospace; letter-spacing: .04em; padding: 2.5cqw 6cqw 0; text-transform: uppercase; opacity: .85; }
.art { position: relative; flex: 1; margin: 4cqw 6cqw 0; overflow: hidden; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lines { padding: 3cqw 6cqw 5cqw; font: 500 4.2cqw/1.15 var(--sans); display: flex; justify-content: space-between; align-items: end; gap: 4cqw; }
.lines b { display: block; font-weight: 500; }
.barcode { flex: 0 0 13cqw; height: 7cqw; background: repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 2px, currentColor 2px 4px, transparent 4px 5px, currentColor 5px 6px, transparent 6px 8px); opacity: .8; }

/* 01 fashion */
.c-fashion .mast { font: italic 900 21cqw/0.8 "Bodoni Moda", serif; letter-spacing: -.03em; text-align: center; padding-top: 6cqw; }
.c-fashion .mast small { display: block; font-size: .48em; font-style: normal; letter-spacing: .32em; font-weight: 500; margin-top: 2cqw; }
.c-fashion .art { background:
  repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 3cqw, transparent 3cqw 6cqw),
  radial-gradient(circle at 50% 30%, #e24b3b, #7d130c 70%); }
/* 02 uav */
.c-uav .mast { font: 400 19cqw/0.86 Anton, sans-serif; letter-spacing: .01em; }
.c-uav .art { background:
  linear-gradient(rgba(140,200,255,.14) 1px, transparent 1px) 0 0 / 8cqw 8cqw,
  linear-gradient(90deg, rgba(140,200,255,.14) 1px, transparent 1px) 0 0 / 8cqw 8cqw,
  radial-gradient(circle at 50% 45%, #22405c, #0b1520 75%); }
.c-uav .art svg { position: absolute; inset: 8% 4%; width: 92%; height: 84%; }
/* 03 geo */
.c-geo .mast { font: 400 15.5cqw/0.9 var(--serif); letter-spacing: -.02em; }
.c-geo .mast em { display: block; font-size: .6em; }
.c-geo .art { background: #fff; border: 1px solid rgba(0,0,0,.25); }
.c-geo .art img { object-fit: contain; padding: 4cqw; }
/* 04 sampler */
.c-sampler .mast { font: 400 20cqw/0.84 "Archivo Black", sans-serif; letter-spacing: -.04em; }
.c-sampler .art { background: #1c1b1a; border-radius: 2cqw; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr 1.2fr; gap: 4cqw; padding: 6cqw; }
.knob { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f3e6d4, #9a8c7a 70%); position: relative; aspect-ratio: 1; align-self: center; justify-self: center; width: 80%; }
.knob::after { content: ""; position: absolute; left: 50%; top: 8%; width: 6%; height: 34%; background: #1c1b1a; transform-origin: 50% 124%; transform: translateX(-50%) rotate(var(--k)); border-radius: 2px; }
.pad { background: #e8641f; border-radius: 1.5cqw; box-shadow: inset 0 -1cqw 0 rgba(0,0,0,.25); }
.pad.off { background: #3a3734; }
/* 05 alcove */
.c-alcove .mast { font: italic 400 25cqw/0.8 var(--serif); letter-spacing: -.03em; text-align: center; }
.c-alcove .art { background: transparent; display: flex; align-items: end; justify-content: center; }
.arch { width: 66%; height: 92%; border-radius: 50cqw 50cqw 0 0; background: linear-gradient(180deg, #f7c483 0%, #c9733a 55%, #6e3519 100%); box-shadow: inset 0 0 0 2.5cqw #f1e6d3; position: relative; }
.arch::after { content: ""; position: absolute; left: 34%; bottom: 0; width: 32%; height: 22%; background: #3b2416; border-radius: 30% 30% 0 0; opacity: .85; }
/* 06 next project */
.c-next .mast { font: 400 16cqw/0.9 Anton, sans-serif; }
.c-next .art { border: 1px dashed currentColor; display: grid; place-items: center; font: 400 4cqw/1.3 "Space Mono", monospace; text-align: center; opacity: .8; }
/* 07 creative */
.c-creative .mast { font: 400 19cqw/0.82 Anton, sans-serif; letter-spacing: -.01em; }
.c-creative .mast span:nth-child(1) { color: #e2532d; } .c-creative .mast span:nth-child(2) { color: #1f4fd1; }
.c-creative .art { background: #efe7d6; }
.c-creative .art i { position: absolute; display: block; }
/* 08 about */
.c-about .mast { font: 700 19cqw/0.85 "Bodoni Moda", serif; letter-spacing: -.02em; text-align: center; padding-top: 6cqw; }
.c-about .art { background: radial-gradient(ellipse at 50% 40%, #e09a55, #6b3414 75%); }
.c-about .art::before { content: ""; position: absolute; left: 50%; top: 22%; width: 32%; aspect-ratio: 1; border-radius: 50%; background: rgba(28,14,6,.75); transform: translateX(-50%); }
.c-about .art::after { content: ""; position: absolute; left: 50%; bottom: -12%; width: 70%; height: 46%; border-radius: 50% 50% 0 0; background: rgba(28,14,6,.75); transform: translateX(-50%); }

/* ---------- caption under the table ---------- */
.label {
  position: fixed; left: 50%; bottom: 22px; z-index: 6; transform: translate(-50%, 8px);
  font: 400 12px/1 "Space Mono", monospace; letter-spacing: .08em; text-transform: uppercase;
  background: rgba(26,16,9,.72); backdrop-filter: blur(6px); padding: 10px 14px; border-radius: 999px;
  opacity: 0; transition: opacity .3s, transform .3s var(--ease); pointer-events: none; white-space: nowrap;
}
.label.on { opacity: 1; transform: translate(-50%, 0); }
.label .no { color: var(--warm); margin-right: 10px; }

/* ---------- placeholder issue page (each project gets its own design later) ---------- */
.reader {
  position: fixed; inset: 0; z-index: 20; background: #f3ede2; color: #1b1410;
  display: grid; place-items: center; text-align: center; padding: 24px;
  opacity: 0; visibility: hidden; transition: opacity .5s, visibility .5s;
}
.reader.open { opacity: 1; visibility: visible; }
.reader .no { font: 400 12px "Space Mono", monospace; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.reader h2 { font: 400 clamp(36px, 7vw, 96px)/1 var(--serif); margin: 14px 0 22px; }
.reader button { font: 400 12px "Space Mono", monospace; letter-spacing: .1em; text-transform: uppercase; background: none; border: 1px solid currentColor; border-radius: 999px; padding: 10px 16px; cursor: pointer; color: inherit; }

/* ---------- phones: the table fills the width, magazines in a taller fan ---------- */
@media (max-aspect-ratio: 4/5) {
  .scene .table { height: auto; width: 100vw; aspect-ratio: 9 / 16; max-height: 100vh; }
  .mag { width: 40%; }
  .hero h1 { font-size: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .mag, .label { transition: none; }
  .hint::after { animation: none; }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="scene">
    <!-- To swap in your own room later: replace images/livingroom.jpg (or put a 3D LiDAR viewer in this layer)
         and update ROOM.focus below to the table's position in the new picture. -->
    <div class="layer" id="room"><img src="images/livingroom.jpg" alt="A warm, lamp-lit living room at dusk with a round white coffee table and a stack of magazines"></div>
    <div class="layer" id="top"><img src="images/tabletop.jpg" alt=""></div>
    <nav class="table" id="table" aria-label="Projects"></nav>
  </div>
  <div class="hero" id="hero">
    <h1>Heeje Lee</h1>
    <p>Creative technologist · Portfolio 2026</p>
  </div>
  <div class="hint" id="hint">Scroll</div>
</div>

<div class="label" id="label" aria-hidden="true"><span class="no"></span><span class="t"></span></div>

<section class="reader" id="reader" aria-live="polite">
  <div><div class="no" id="rNo"></div><h2 id="rTitle"></h2><button id="rBack" type="button">← Back to the table</button></div>
</section>

<script>
/* =========================================================
   EDIT HERE
   Each magazine: slug (its link), no, title, the cover style, and optional `img`
   to drop a real image into the cover's picture area (e.g. img: "images/fastfashion.jpg").
   x / y place the magazine on the table (percent of the table area), r is its rotation.
   The `phone` values are used on tall, narrow screens.
   ========================================================= */
const ROOM = {
  focus: { x: 49.5, y: 66 },   // where the coffee table is in livingroom.jpg (percent)
  zoom: 3.3                     // how far the camera pushes in before switching to the top view
};

const MAGS = [
  { slug: "fast-fashion", no: "01", title: "Fast-Fashion", style: "fashion",
    x: 8,  y: 10, r: -9, phone: { x: 4,  y: 2,  r: -6 } },
  { slug: "globalhawk", no: "02", title: "GlobalHawk UAV Systems Design and Integration", style: "uav",
    x: 27, y: 5,  r: -3, phone: { x: 54, y: 0,  r: 5 } },
  { slug: "geographical-communication-systems", no: "03", title: "Geographical Communication Systems Design", style: "geo",
    img: "images/commsnetwork_main.png",
    x: 46, y: 8,  r: 5,  phone: { x: 6,  y: 22, r: 4 } },
  { slug: "analog-sampler", no: "04", title: "Analog Sampler", style: "sampler",
    x: 64, y: 14, r: 10, phone: { x: 52, y: 23, r: -5 } },
  { slug: "alcove", no: "05", title: "Alcove", style: "alcove",
    x: 7,  y: 44, r: 6,  phone: { x: 3,  y: 45, r: -3 } },
  { slug: "project-06", no: "06", title: "Project 06", style: "next",
    x: 26, y: 47, r: -5, phone: { x: 56, y: 46, r: 6 } },
  { slug: "creative-works", no: "07", title: "Creative Works", style: "creative",
    x: 45, y: 44, r: 3,  phone: { x: 6,  y: 68, r: 5 } },
  { slug: "about", no: "08", title: "About Me", style: "about",
    x: 63, y: 48, r: -8, phone: { x: 53, y: 69, r: -4 } }
];
/* ========================================================= */

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const art = (m, inner = "") => `<div class="art">${m.img ? `<img src="${esc(m.img)}" alt="" loading="lazy">` : inner}</div>`;
const foot = (a, b) => `<div class="lines"><div><b>${a}</b>${b}</div><span class="barcode"></span></div>`;
const issue = (m, right) => `<div class="issue"><span>No. ${m.no}</span><span>${right}</span></div>`;

const COVERS = {
  fashion: (m) => `<div class="cover c-fashion" style="--bg:#b3261e;--fg:#fbefe4">
      <h3 class="mast">Fast<small>FASHION</small></h3>${issue(m, "2026")}
      ${art(m, `<svg viewBox="0 0 100 100" style="position:absolute;inset:18% 14%;width:72%;height:64%" fill="none" stroke="#fbefe4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M50 22a7 7 0 1 1 7 7c-4 0-7 2-7 6v3"/><path d="M50 38 12 66c-4 3-2 8 3 8h70c5 0 7-5 3-8L50 38z"/></svg>`)}
      ${foot("The true cost", "of a five-dollar tee")}</div>`,
  uav: (m) => `<div class="cover c-uav" style="--bg:#0e1824;--fg:#e8f1fb">
      <h3 class="mast">GLOBAL<br>HAWK</h3>${issue(m, "UAV Systems")}
      ${art(m, `<svg viewBox="0 0 200 120" fill="#cfe3f5"><path d="M100 8c5 0 8 6 8 14v26l86 10v6l-86-2v30l18 10v5l-26-4-26 4v-5l18-10V62l-86 2v-6l86-10V22c0-8 3-14 8-14z"/></svg>`)}
      ${foot("Design &amp; integration", "at 60,000 ft")}</div>`,
  geo: (m) => `<div class="cover c-geo" style="--bg:#f1ebdd;--fg:#1d1a16">
      <h3 class="mast">Geographic<em>Comms</em></h3>${issue(m, "Systems Design")}
      ${art(m)}${foot("Mapping a network", "tower by tower")}</div>`,
  sampler: (m) => `<div class="cover c-sampler" style="--bg:#e8641f;--fg:#1c1b1a">
      <h3 class="mast">ANALOG<br>SAMPLER</h3>${issue(m, "Sound")}
      ${art(m, `${[-40, 20, 110, 60, -100, 0].map((k) => `<span class="knob" style="--k:${k}deg"></span>`).join("")}<span class="pad"></span><span class="pad off"></span><span class="pad"></span>`)}
      ${foot("Hands on", "every sound")}</div>`,
  alcove: (m) => `<div class="cover c-alcove" style="--bg:#ece0cb;--fg:#3b2416">
      <h3 class="mast">alcove</h3>${issue(m, "Space")}
      ${art(m, `<div class="arch"></div>`)}${foot("A corner", "to belong to")}</div>`,
  next: (m) => `<div class="cover c-next" style="--bg:#26332a;--fg:#e9e3d2">
      <h3 class="mast">PROJECT<br>SIX</h3>${issue(m, "Soon")}
      ${art(m, `<span>Next issue<br>in print soon</span>`)}${foot("Coming", "soon")}</div>`,
  creative: (m) => `<div class="cover c-creative" style="--bg:#f6f1e7;--fg:#1d1a16">
      <h3 class="mast"><span>CREATIVE</span><br><span>WORKS</span></h3>${issue(m, "Art")}
      ${art(m, `<i style="left:8%;top:12%;width:38%;aspect-ratio:1;border-radius:50%;background:#e2532d"></i>
        <i style="right:10%;top:8%;width:30%;height:44%;background:#1f4fd1"></i>
        <i style="left:30%;bottom:10%;width:46%;height:22%;background:#f2b630;transform:rotate(-8deg)"></i>
        <i style="right:16%;bottom:28%;width:16%;aspect-ratio:1;border-radius:50%;background:#1d1a16"></i>`)}
      ${foot("Sketches, objects", "&amp; experiments")}</div>`,
  about: (m) => `<div class="cover c-about" style="--bg:#191512;--fg:#f4e8d8">
      <h3 class="mast">HEEJE<br>LEE</h3>${issue(m, "About Me")}
      ${art(m)}${foot("The designer issue", "engineer turned maker")}</div>`
};

/* ---------- build the magazines ---------- */
const table = document.getElementById("table");
const phone = matchMedia("(max-aspect-ratio: 4/5)");
function place() {
  [...table.children].forEach((el, i) => {
    const m = MAGS[i], p = phone.matches && m.phone ? m.phone : m;
    el.style.setProperty("--x", p.x + "%");
    el.style.setProperty("--y", p.y + "%");
    el.style.setProperty("--r", p.r + "deg");
    /* on hover, slide out away from the middle of the table */
    const ang = Math.atan2(p.y + 20 - 50, p.x + 13 - 50);
    el.style.setProperty("--px", (Math.cos(ang) * 4).toFixed(1) + "%");
    el.style.setProperty("--py", (Math.sin(ang) * 4 - 3).toFixed(1) + "%");
  });
}
table.innerHTML = MAGS.map((m, i) => `
  <a class="mag" href="#${m.slug}" style="z-index:${i + 1}" aria-label="${esc(m.no + " " + m.title)}" tabindex="-1">${COVERS[m.style](m)}</a>`).join("");
place();
phone.addEventListener("change", place);

/* ---------- scroll-driven camera ---------- */
const room = document.getElementById("room"), topV = document.getElementById("top");
const hero = document.getElementById("hero"), hint = document.getElementById("hint");
const mags = [...table.children];
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ramp = (v, a, b) => clamp((v - a) / (b - a));
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let target = 0, shown = 0, live = false;
function progress() {
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? clamp(scrollY / max) : 0;
}
function render(p) {
  /* 1. push into the coffee table */
  const z = ease(ramp(p, 0, .62));
  const s = 1 + (ROOM.zoom - 1) * z;
  const ox = (ROOM.focus.x - 50) / 100, oy = (ROOM.focus.y - 50) / 100;
  room.style.transform = `translate(${-ox * s * z * 100}%, ${-oy * s * z * 100}%) scale(${s})`;
  room.style.filter = `blur(${ramp(p, .42, .62) * 6}px)`;
  /* 2. cross-fade to looking straight down at the table */
  const t = ease(ramp(p, .44, .7));
  room.style.opacity = 1 - t;
  topV.style.opacity = t;
  topV.style.transform = `scale(${1.28 - .28 * t}) rotate(${(1 - t) * -4}deg)`;
  topV.style.filter = `blur(${(1 - t) * 8}px)`;
  /* 3. magazines settle onto the table one after another */
  mags.forEach((el, i) => {
    const k = ease(ramp(p, .6 + i * .03, .78 + i * .03));
    el.style.setProperty("--in", k);
    el.style.setProperty("--dy", `${(1 - k) * -18}%`);
  });
  hero.style.opacity = 1 - ramp(p, 0, .18);
  hero.style.transform = `translateY(${-ramp(p, 0, .18) * 20}px)`;
  hint.style.opacity = .8 * (1 - ramp(p, 0, .08));
  const on = p > .95;
  if (on !== live) {
    live = on;
    table.classList.toggle("live", on);
    mags.forEach((el) => el.tabIndex = on ? 0 : -1);
    if (!on) setLabel(null);
  }
}
function tick() {
  shown += (target - shown) * (reduce ? 1 : .12);
  if (Math.abs(target - shown) < .0005) shown = target;
  render(shown);
  if (shown !== target) requestAnimationFrame(tick); else running = false;
}
let running = false;
function onScroll() {
  target = progress();
  if (!running) { running = true; requestAnimationFrame(tick); }
}
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", onScroll);

/* ease to the end of the scroll if the visitor stops part-way through */
let idle;
addEventListener("scroll", () => {
  clearTimeout(idle);
  idle = setTimeout(() => {
    const p = progress(), max = document.documentElement.scrollHeight - innerHeight;
    if (document.body.classList.contains("reading")) return;
    if (p > .55 && p < .99) scrollTo({ top: max, behavior: "smooth" });
    else if (p > .01 && p < .2) scrollTo({ top: 0, behavior: "smooth" });
  }, 260);
}, { passive: true });

/* ---------- hover caption ---------- */
const label = document.getElementById("label");
function setLabel(m) {
  label.classList.toggle("on", !!m);
  if (m) { label.querySelector(".no").textContent = "No. " + m.no; label.querySelector(".t").textContent = m.title; }
}
mags.forEach((el, i) => {
  el.addEventListener("mouseenter", () => live && setLabel(MAGS[i]));
  el.addEventListener("focus", () => live && setLabel(MAGS[i]));
  el.addEventListener("mouseleave", () => setLabel(null));
  el.addEventListener("blur", () => setLabel(null));
});

/* ---------- opening an issue (placeholder until each project is designed) ---------- */
const reader = document.getElementById("reader");
function route() {
  const m = MAGS.find((x) => "#" + x.slug === location.hash);
  reader.classList.toggle("open", !!m);
  document.body.classList.toggle("reading", !!m);
  if (m) {
    document.getElementById("rNo").textContent = "No. " + m.no;
    document.getElementById("rTitle").textContent = m.title;
    document.title = `${m.title} — Heeje Lee`;
    setLabel(null);
  } else {
    document.title = "Heeje Lee — Portfolio";
    requestAnimationFrame(() => { scrollTo(0, document.documentElement.scrollHeight); onScroll(); });
  }
}
document.getElementById("rBack").addEventListener("click", () => { history.pushState(null, "", location.pathname); route(); });
addEventListener("hashchange", route);
addEventListener("popstate", route);
if (location.hash) route();
onScroll();
</script>
